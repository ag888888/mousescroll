name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/MouseScroll.app MouseScroll.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" MouseScroll.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
          echo "sha256: $(shasum -a 256 MouseScroll.zip | cut -d' ' -f1)"
